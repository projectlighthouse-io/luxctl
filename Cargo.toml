[workspace]
members = [".", "crates/blueprint"]

[package]
name = "luxctl"
version = "0.15.0"
edition = "2021"
description = "Learn by building - CLI for projectlighthouse.io"
license = "AGPL-3.0-only"
repository = "https://github.com/thearyanahmed/luxctl"
homepage = "https://projectlighthouse.io"
keywords = ["cli", "education", "engineering", "exercises"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
blueprint = { version = "0.4.0", path = "crates/blueprint", package = "lux-blueprint" }
tokio = { version = "1.42", features = ["full"] }
once_cell = "1.20"
clap = { version = "4.5.52", features = ["derive"] }
clap_complete = "4.5"
async-trait = "0.1.89"
log = "0.4.28"
env_logger = "0.11"
regex = "1"
color-eyre = "0.6.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "5.0"
secrecy = { version = "0.10.3", features = ["serde"] }
colored = "3.0.0"
termimad = "0.30"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
nix = { version = "0.29", features = ["signal", "process"] }
rand = "0.8"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
# Prevent common mistakes
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "warn"

# Code quality
needless_return = "warn"
redundant_clone = "warn"
redundant_closure = "warn"
useless_vec = "warn"
manual_map = "warn"
manual_filter = "warn"
map_flatten = "warn"
single_match = "warn"
single_match_else = "warn"
match_bool = "warn"
needless_bool = "warn"
if_same_then_else = "warn"
collapsible_if = "warn"
collapsible_else_if = "warn"

# Dead code / unused
unused_async = "warn"
unused_self = "warn"

[lints.rust]
unsafe_code = "warn"
dead_code = "warn"

# optimized for smallest binary size at the cost of compile time
[profile.release]
opt-level = "z"     # optimize for size
lto = true          # link-time optimization
codegen-units = 1   # single codegen unit for better optimization
panic = "abort"     # no unwinding, smaller binary
strip = true        # strip symbols
